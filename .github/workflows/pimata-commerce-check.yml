name: PiMaTa Commerce Lock Repair

on:
  push:
    branches: [pimata-commerce]
    paths:
      - 'pimata-commerce/**'
      - '.github/workflows/pimata-commerce-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pimata-commerce
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: pimata-commerce/package-lock.json
      - name: Repair npm lockfile
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund
          npm ci --dry-run --no-audit --no-fund
      - name: Commit verified lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already accepted by npm ci and unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(pimata): repair npm lockfile for npm ci'
          git push origin HEAD:pimata-commerce
