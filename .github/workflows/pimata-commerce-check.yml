name: PiMaTa Commerce Check

on:
  push:
    branches: [pimata-commerce]
    paths:
      - 'pimata-commerce/**'
      - '.github/workflows/pimata-commerce-check.yml'
  pull_request:
    paths:
      - 'pimata-commerce/**'
      - '.github/workflows/pimata-commerce-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pimata_medusa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pimata_medusa"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: pimata-commerce
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pimata_medusa
      REDIS_URL: redis://127.0.0.1:6379
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:8000,http://localhost:9000
      JWT_SECRET: ci-jwt-secret-not-production
      COOKIE_SECRET: ci-cookie-secret-not-production
      MEDUSA_WORKER_MODE: shared
      DISABLE_MEDUSA_ADMIN: 'false'
      MEDUSA_BACKEND_URL: http://localhost:9000
      MERCADO_PAGO_ACCESS_TOKEN: TEST-CI-MERCADO-PAGO-TOKEN
      MERCADO_PAGO_BACKEND_URL: https://backend-ci.example.com
      MERCADO_PAGO_STOREFRONT_URL: https://store-ci.example.com
      MELHOR_ENVIO_TOKEN: TEST-CI-MELHOR-ENVIO-TOKEN
      MELHOR_ENVIO_SANDBOX: 'true'
      MELHOR_ENVIO_ORIGIN_POSTAL_CODE: '13800000'
      MELHOR_ENVIO_USER_AGENT: PiMaTa CI (contato@pimata.app)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: pimata-commerce/package.json
      - name: Verify no committed local secrets
        run: |
          set -euo pipefail
          test ! -f .env
          if grep -R -E 'APP_USR-[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9_-]{10,}' . --exclude-dir=node_modules; then exit 1; fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Export generated package lock
        uses: actions/upload-artifact@v4
        with:
          name: pimata-commerce-package-lock
          path: pimata-commerce/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: TypeScript check
        run: npm run typecheck
      - name: Build Medusa production artifact
        run: npm run build
      - name: Verify dedicated database starts empty
        run: |
          TABLES="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d pimata_medusa -Atc "select count(*) from information_schema.tables where table_schema='public';")"
          test "${TABLES}" -eq 0
      - name: Run Medusa database migrations
        timeout-minutes: 8
        run: npm run predeploy
      - name: Verify custom providers registered
        run: |
          set -euo pipefail
          MP="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d pimata_medusa -Atc "select count(*) from payment_provider where id='pp_mercadopago_mercadopago';")"
          ME="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d pimata_medusa -Atc "select count(*) from fulfillment_provider where id='melhor-envio_melhor-envio';")"
          test "${MP}" -eq 1
          test "${ME}" -eq 1
      - name: Bootstrap PiMaTa Brazil store
        timeout-minutes: 5
        run: npm run bootstrap
      - name: Verify bootstrap is idempotent
        timeout-minutes: 5
        run: npm run bootstrap
      - name: Verify PiMaTa commercial bootstrap records
        run: |
          set -euo pipefail
          BR="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d pimata_medusa -Atc "select count(*) from region where name='Brasil' and currency_code='brl';")"
          CH="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d pimata_medusa -Atc "select count(*) from sales_channel where name='PiMaTa Online';")"
          LOC="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d pimata_medusa -Atc "select count(*) from stock_location where name='Estoque PiMaTa';")"
          KEY="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d pimata_medusa -Atc "select count(*) from api_key where title='PiMaTa Storefront' and type='publishable';")"
          SETS="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d pimata_medusa -Atc "select count(*) from fulfillment_set where name='PiMaTa Brasil delivery';")"
          PICKUP="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d pimata_medusa -Atc "select count(*) from shipping_option where name='Retirada PiMaTa';")"
          MEOPT="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d pimata_medusa -Atc "select count(*) from shipping_option where name='Melhor Envio — menor preço';")"
          test "${BR}" -eq 1
          test "${CH}" -eq 1
          test "${LOC}" -eq 1
          test "${KEY}" -eq 1
          test "${SETS}" -eq 1
          test "${PICKUP}" -eq 1
          test "${MEOPT}" -eq 1
      - name: Start Medusa and verify health
        timeout-minutes: 5
        run: |
          set -euo pipefail
          npm start >/tmp/pimata-medusa.log 2>&1 &
          PID=$!
          trap 'kill "${PID}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/health | grep -q 'OK'; then exit 0; fi
            sleep 2
          done
          cat /tmp/pimata-medusa.log
          exit 1
