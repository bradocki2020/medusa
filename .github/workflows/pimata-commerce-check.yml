name: PiMaTa Commerce Check

on:
  push:
    branches: [pimata-commerce]
    paths:
      - 'pimata-commerce/**'
      - '.github/workflows/pimata-commerce-check.yml'
  pull_request:
    paths:
      - 'pimata-commerce/**'
      - '.github/workflows/pimata-commerce-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pimata_medusa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pimata_medusa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: pimata-commerce

    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pimata_medusa
      DATABASE_SCHEMA: medusa
      REDIS_URL: redis://127.0.0.1:6379
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:8000,http://localhost:9000
      JWT_SECRET: ci-jwt-secret-not-production
      COOKIE_SECRET: ci-cookie-secret-not-production
      MEDUSA_WORKER_MODE: shared
      DISABLE_MEDUSA_ADMIN: 'false'
      MEDUSA_BACKEND_URL: http://localhost:9000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: pimata-commerce/package.json

      - name: Verify no committed local secrets
        run: |
          set -euo pipefail
          test ! -f .env
          if grep -R -E 'APP_USR-[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9_-]{10,}' . --exclude-dir=node_modules; then
            echo 'Possível segredo real encontrado no código versionado.'
            exit 1
          fi

      - name: Validate package manifest
        run: npm pkg get name version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Build Medusa production artifact
        run: npm run build

      - name: Prepare isolated Medusa schema
        run: |
          PGPASSWORD=postgres psql \
            -h 127.0.0.1 \
            -U postgres \
            -d pimata_medusa \
            -v ON_ERROR_STOP=1 \
            -c 'create schema if not exists medusa;'

      - name: Run Medusa database migrations
        timeout-minutes: 8
        run: npm run predeploy

      - name: Verify tables are isolated in medusa schema
        run: |
          set -euo pipefail
          MEDUSA_TABLES="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d pimata_medusa -Atc "select count(*) from information_schema.tables where table_schema = 'medusa';")"
          PUBLIC_TABLES="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d pimata_medusa -Atc "select count(*) from information_schema.tables where table_schema = 'public';")"
          echo "medusa tables: ${MEDUSA_TABLES}"
          echo "public tables: ${PUBLIC_TABLES}"
          test "${MEDUSA_TABLES}" -gt 0
          test "${PUBLIC_TABLES}" -eq 0

      - name: Start Medusa and verify health
        timeout-minutes: 5
        run: |
          set -euo pipefail
          npm start >/tmp/pimata-medusa.log 2>&1 &
          MEDUSA_PID=$!
          trap 'kill "${MEDUSA_PID}" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/health | grep -q 'OK'; then
              echo 'Medusa health check OK.'
              exit 0
            fi
            sleep 2
          done

          echo 'Medusa did not become healthy.'
          cat /tmp/pimata-medusa.log
          exit 1
