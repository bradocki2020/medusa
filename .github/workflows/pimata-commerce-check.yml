name: PiMaTa Commerce Check

on:
  push:
    branches: [pimata-commerce]
    paths:
      - 'pimata-commerce/**'
      - '.github/workflows/pimata-commerce-check.yml'
  pull_request:
    paths:
      - 'pimata-commerce/**'
      - '.github/workflows/pimata-commerce-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pimata_medusa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pimata_medusa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: pimata-commerce

    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pimata_medusa
      REDIS_URL: redis://127.0.0.1:6379
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:8000,http://localhost:9000
      JWT_SECRET: ci-jwt-secret-not-production
      COOKIE_SECRET: ci-cookie-secret-not-production
      MEDUSA_WORKER_MODE: shared
      DISABLE_MEDUSA_ADMIN: 'false'
      MEDUSA_BACKEND_URL: http://localhost:9000
      MERCADO_PAGO_ACCESS_TOKEN: TEST-CI-MERCADO-PAGO-TOKEN
      MERCADO_PAGO_BACKEND_URL: https://backend-ci.example.com
      MERCADO_PAGO_STOREFRONT_URL: https://store-ci.example.com
      MELHOR_ENVIO_TOKEN: TEST-CI-MELHOR-ENVIO-TOKEN
      MELHOR_ENVIO_SANDBOX: 'true'
      MELHOR_ENVIO_ORIGIN_POSTAL_CODE: '13800000'
      MELHOR_ENVIO_USER_AGENT: PiMaTa CI (contato@pimata.app)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: pimata-commerce/package.json
      - name: Verify no committed local secrets
        run: |
          set -euo pipefail
          test ! -f .env
          if grep -R -E 'APP_USR-[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9_-]{10,}' . --exclude-dir=node_modules; then
            echo 'Possível segredo real encontrado no código versionado.'
            exit 1
          fi
      - name: Validate package manifest
        run: npm pkg get name version
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Build Medusa production artifact
        run: npm run build
      - name: Verify dedicated database starts empty
        run: |
          set -euo pipefail
          PUBLIC_TABLES="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d pimata_medusa -Atc "select count(*) from information_schema.tables where table_schema = 'public';")"
          test "${PUBLIC_TABLES}" -eq 0
      - name: Run Medusa database migrations
        timeout-minutes: 8
        run: npm run predeploy
      - name: Verify Medusa tables in dedicated database
        run: |
          set -euo pipefail
          PUBLIC_TABLES="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d pimata_medusa -Atc "select count(*) from information_schema.tables where table_schema = 'public';")"
          PRODUCT_TABLE="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d pimata_medusa -Atc "select count(*) from information_schema.tables where table_schema = 'public' and table_name = 'product';")"
          test "${PUBLIC_TABLES}" -gt 50
          test "${PRODUCT_TABLE}" -eq 1
      - name: Verify custom providers registered
        run: |
          set -euo pipefail
          MP_PROVIDER="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d pimata_medusa -Atc "select count(*) from payment_provider where id = 'pp_mercadopago_mercadopago';")"
          ME_PROVIDER="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d pimata_medusa -Atc "select count(*) from fulfillment_provider where id = 'melhor-envio_melhor-envio';")"
          test "${MP_PROVIDER}" -eq 1
          test "${ME_PROVIDER}" -eq 1
      - name: Bootstrap PiMaTa Brazil store
        timeout-minutes: 5
        run: npm run bootstrap
      - name: Verify bootstrap is idempotent
        timeout-minutes: 5
        run: npm run bootstrap
      - name: Verify PiMaTa bootstrap records
        run: |
          set -euo pipefail
          BR_REGION="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d pimata_medusa -Atc "select count(*) from region where name = 'Brasil' and currency_code = 'brl';")"
          PIMATA_CHANNEL="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d pimata_medusa -Atc "select count(*) from sales_channel where name = 'PiMaTa Online';")"
          PIMATA_LOCATION="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d pimata_medusa -Atc "select count(*) from stock_location where name = 'Estoque PiMaTa';")"
          PUBLISHABLE_KEY="$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d pimata_medusa -Atc "select count(*) from api_key where title = 'PiMaTa Storefront' and type = 'publishable';")"
          test "${BR_REGION}" -eq 1
          test "${PIMATA_CHANNEL}" -eq 1
          test "${PIMATA_LOCATION}" -eq 1
          test "${PUBLISHABLE_KEY}" -eq 1
      - name: Start Medusa and verify health
        timeout-minutes: 5
        run: |
          set -euo pipefail
          npm start >/tmp/pimata-medusa.log 2>&1 &
          MEDUSA_PID=$!
          trap 'kill "${MEDUSA_PID}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/health | grep -q 'OK'; then
              echo 'Medusa health check OK.'
              exit 0
            fi
            sleep 2
          done
          cat /tmp/pimata-medusa.log
          exit 1
