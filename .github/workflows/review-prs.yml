name: PR Review - PiMaTa Fork Safe

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-event:
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request context
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"
          test -n "$PR_HEAD_SHA"
          test -n "$PR_BASE_REF"
          echo "PiMaTa fork PR #$PR_NUMBER: $PR_HEAD_SHA -> $PR_BASE_REF"

      - name: Checkout trusted base revision
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - name: Confirm fork-safe review policy
        run: |
          set -euo pipefail
          echo "Fork-safe PR gate active."
          echo "Upstream Medusa AI review workflow is intentionally disabled in this fork."
          echo "No MEDUSA_APP_ID, MEDUSA_APP_PRIVATE_KEY, CLAUDE_CODE_API_TOKEN or Slack secrets are required."
